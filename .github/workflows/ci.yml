name: ci

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/spec_lint.py
      - run: python tools/license_gate.py

  test-pure:
    # Runs without ComfyUI: pure core/tool tests pass, ComfyUI-dependent tests skip.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest

  test-full:
    # Installs ComfyUI (CPU) so the full node test suite runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ComfyUI (CPU) for the test environment
        run: |
          git clone --depth 1 https://github.com/comfyanonymous/ComfyUI /tmp/ComfyUI
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          pip install -r /tmp/ComfyUI/requirements.txt
          pip install pytest
      - run: pytest
        env:
          PYTHONPATH: /tmp/ComfyUI
