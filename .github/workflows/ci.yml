name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 0" # weekly full suite
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/spec_lint.py
      - run: python tools/license_gate.py

  test-pure:
    # Runs without ComfyUI: ComfyUI-dependent test modules skip themselves.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pillow pytest
      - name: Run pytest
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-pure-${{ matrix.python-version }}
          path: pytest.log

  test-full:
    # Full suite in a CPU ComfyUI environment. Scheduled/manual only: installing ComfyUI is
    # heavy and network-fragile, so it must not block every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ComfyUI (CPU) for the test environment
        run: |
          git clone --depth 1 https://github.com/comfyanonymous/ComfyUI /tmp/ComfyUI
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/ComfyUI/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pytest
      - run: pytest
        env:
          PYTHONPATH: /tmp/ComfyUI
