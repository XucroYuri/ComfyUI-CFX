[project]
name = "comfyui-cfx"
version = "0.0.0"
description = "Consolidated ComfyUI custom-node suite (MIT)"
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
pythonpath = ["."]
