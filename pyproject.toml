[project]
name = "comfyui-cfx"
version = "0.0.0"
description = "Consolidated ComfyUI custom-node suite (MIT)"
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Tests import after ``pytest.importorskip`` and verification scripts import after
# ``bootstrap()``; both are intentional module-level import orders.
"tests/*" = ["E402"]
"tools/verify/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
pythonpath = ["."]
